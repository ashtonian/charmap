# Versions follow Conventional Commits: fix -> patch, feat -> minor, a
# "BREAKING CHANGE:" footer or "!" -> major. Other commits do not release.
branches:
  - main
tagFormat: "v${version}"
plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  # Comments and labels would need issues/pull-requests write access.
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      releasedLabels: false
