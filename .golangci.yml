version: "2"

linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # Paths come from the operator's --dir and from walking it; every file
        # operation goes through an os.Root confined to that directory.
        - G304
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests create fixtures with ordinary permissions on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ashtonian/charmap
