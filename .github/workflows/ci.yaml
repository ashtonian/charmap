env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}

name: CI

on:
  pull_request:
  # The full, unscoped run; it does nothing when main has not moved since the
  # last green one (go-ci-actions scope).
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  # Release runs this workflow before publishing anything.
  workflow_call:
    # A called workflow sees only the secrets its caller passes.
    secrets:
      CI_ARTIFACT_ENDPOINT:
        description: Artifact gateway origin, kept in a secret so run logs mask it
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The scope job decides which jobs a change needs and which packages they
# check: the changed packages and every package that imports one
# (go-ci-actions scope). A pull request is measured from its base; a release
# (release.yaml calls this workflow for the push) checks everything, unless
# the merged pull request already passed every job on the same tree
# (go-ci-actions acceptance). The nightly schedule, a manual run and the
# full-ci label check everything.
jobs:
  scope:
    name: scope
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.accepted.outputs.remaining || steps.scope.outputs.jobs }}
      test-packages: ${{ steps.packages.outputs.test }}
      lint-packages: ${{ steps.packages.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go loads the package graph.
      - uses: ashtonian/go-ci-actions@08c90cf92313762d7c2a1d85f665403ee3f53c0f # v1.8.0
        with:
          go-version-file: go.mod
      # The image's inputs are the binary's package graph (".", main) and the
      # files that build and check it.
      - id: scope
        uses: ashtonian/go-ci-actions/scope@08c90cf92313762d7c2a1d85f665403ee3f53c0f # v1.8.0
        with:
          # A release calls this workflow from release.yaml.
          workflow: ci.yaml
          jobs: |
            {
              "test": {"paths": ["scripts/smoke.sh"], "go": ["./..."]},
              "lint": {"paths": [".golangci.yml", ".github/workflows/**", ".github/actions/**", "scripts/**"], "go": ["./..."]},
              "image": {"paths": ["Dockerfile", ".github/actions/image/**", "scripts/build-binaries.sh", "scripts/verify-image.sh"], "go": ["."]}
            }
          shared: |
            .github/workflows/ci.yaml
          go-ignore: |
            .github/**
            .gitignore
            .golangci.yml
            .releaserc.yaml
            Dockerfile
            LICENSE
            README.md
            scripts/**
      # The packages each Go job checks: the affected ones, or all of them
      # when the job's own files changed.
      - id: packages
        env:
          GO_PACKAGES: ${{ steps.scope.outputs.go-packages }}
          WIDE_JOBS: ${{ steps.scope.outputs.wide-jobs }}
        run: |
          affected=$(jq -r '.["."] // [] | join(" ")' <<<"$GO_PACKAGES")
          for job in test lint; do
            if jq -e --arg job "$job" 'index($job)' <<<"$WIDE_JOBS" >/dev/null; then
              echo "$job=./..." >>"$GITHUB_OUTPUT"
            else
              echo "$job=$affected" >>"$GITHUB_OUTPUT"
            fi
          done
      - id: accepted
        if: github.event_name == 'push'
        uses: ashtonian/go-ci-actions/acceptance@08c90cf92313762d7c2a1d85f665403ee3f53c0f # v1.8.0
        with:
          mode: verify
          # The caller's workflow is release.yaml; receipts are this file's.
          workflow: ci.yaml
          required: ${{ steps.scope.outputs.jobs }}
          variables: ${{ toJSON(vars) }}
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    needs: scope
    if: contains(needs.scope.outputs.jobs, '"test"')
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'arc-charmap' || matrix.os }}
    timeout-minutes: 15
    env:
      PACKAGES: ${{ needs.scope.outputs.test-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@08c90cf92313762d7c2a1d85f665403ee3f53c0f # v1.8.0
        with:
          workload: ${{ toJSON(matrix) }}
          go-version: ${{ matrix.go }}
      # PACKAGES is a space-separated list of package directories.
      - run: |
          read -r -a packages <<<"$PACKAGES"
          go vet "${packages[@]}"
          go test -race -count=1 "${packages[@]}"
      - if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x' && (env.PACKAGES == './...' || contains(format(' {0} ', env.PACKAGES), ' ./internal/token '))
        run: go test -run '^$' -fuzz FuzzRender -fuzztime 60s ./internal/token
      # The binary is the main package at the root.
      - if: env.PACKAGES == './...' || contains(format(' {0} ', env.PACKAGES), ' . ')
        run: scripts/smoke.sh
  lint:
    needs: scope
    if: contains(needs.scope.outputs.jobs, '"lint"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 15
    env:
      PACKAGES: ${{ needs.scope.outputs.lint-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # govulncheck checks the standard library of the Go that runs it, so
      # this job resolves the newest released patch rather than the one the
      # runner image carries.
      - uses: ashtonian/go-ci-actions@08c90cf92313762d7c2a1d85f665403ee3f53c0f # v1.8.0
        with:
          go-version: "1.27.x"
          check-latest: "true"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: golangci-lint
        if: env.PACKAGES != ''
        run: |
          read -r -a packages <<<"$PACKAGES"
          golangci-lint run "${packages[@]}"
      - name: govulncheck
        if: env.PACKAGES != ''
        run: |
          read -r -a packages <<<"$PACKAGES"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 "${packages[@]}"
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: shellcheck
        run: shellcheck scripts/*.sh
  # Releases build and verify both platforms with the same action
  # (release.yaml), so pull requests and the nightly build linux/amd64 only,
  # without attestations.
  image:
    needs: scope
    if: github.event_name != 'push' && contains(needs.scope.outputs.jobs, '"image"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 15
    services:
      registry:
        image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image
        with:
          platforms: linux/amd64
          version: ci-${{ github.sha }}
          image: localhost:5000/charmap
          tag: ci
  accepted:
    name: record validation
    needs: [scope, test, lint, image]
    # When no selected job failed. The status check must be explicit: with
    # the default success(), a job the scope skipped would skip this one.
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.scope.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions/acceptance@08c90cf92313762d7c2a1d85f665403ee3f53c0f # v1.8.0
        with:
          mode: record
          results: ${{ toJSON(needs) }}
          variables: ${{ toJSON(vars) }}
