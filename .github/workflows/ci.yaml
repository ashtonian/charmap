env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}

name: CI

on:
  pull_request:
  # Release runs this workflow before publishing anything.
  workflow_call:
    # A called workflow sees only the secrets its caller passes.
    secrets:
      CI_ARTIFACT_ENDPOINT:
        description: Artifact gateway origin, kept in a secret so run logs mask it
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request's run ends by recording a receipt of the tested merge tree
# (go-ci-actions acceptance). When release.yaml calls this workflow for the
# push that merged it, the checks that passed on the same tree are skipped.
jobs:
  acceptance:
    name: reuse pull request validation
    if: github.event_name == 'push' && github.actor_id == '4212452'
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: verify
        uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: verify
          # The caller's workflow is release.yaml; receipts are this file's.
          workflow: ci.yaml
          variables: ${{ toJSON(vars) }}
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    needs: acceptance
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        os: [ubuntu-latest, macos-latest]
    # !cancelled() runs the job when acceptance is skipped, as on pull requests.
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'arc-charmap' || matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          workload: ${{ toJSON(matrix) }}
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: go test -run '^$' -fuzz FuzzRender -fuzztime 60s ./internal/token
      - run: scripts/smoke.sh
  lint:
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # govulncheck checks the standard library of the Go that runs it, so
      # this job resolves the newest released patch rather than the one the
      # runner image carries.
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version: "1.27.x"
          check-latest: "true"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: shellcheck
        run: shellcheck scripts/*.sh
  # Releases build and verify both platforms with the same action
  # (release.yaml), so pull requests build linux/amd64 only, without
  # attestations.
  image:
    if: github.event_name == 'pull_request' && github.actor_id == '4212452' && github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 15
    services:
      registry:
        image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image
        with:
          platforms: linux/amd64
          version: ci-${{ github.sha }}
          image: localhost:5000/charmap
          tag: ci
  accepted:
    name: record validation
    needs: [test, lint, image]
    # Only when every validation job passed. The status check must be explicit:
    # without one, the skipped acceptance job upstream would skip this one.
    if: ${{ github.event_name == 'pull_request' && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-charmap
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: record
          results: ${{ toJSON(needs) }}
          variables: ${{ toJSON(vars) }}
