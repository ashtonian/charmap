name: Release

# Every push to main is planned: semantic-release works out whether its
# commits call for a release (see .releaserc.yaml). Only a release runs CI,
# which skips the checks the merged pull request already passed on the same
# tree. The image is built, pushed under its version and verified before the
# Git tag exists, so a tag never points at a missing or broken image and a
# failed run can simply be re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write

# One release at a time. A queued run waits rather than cancelling one that
# may already have pushed an image.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
  IMAGE: docker.io/ashtonian/charmap
  SEMANTIC_RELEASE_VERSION: 25.0.9

jobs:
  plan:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-charmap
    timeout-minutes: 10
    permissions:
      id-token: write
      # semantic-release verifies push access even in dry-run mode.
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.new_release_version }}
      major: ${{ steps.semrel.outputs.new_release_major_version }}
      minor: ${{ steps.semrel.outputs.new_release_minor_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semrel
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: ${{ env.SEMANTIC_RELEASE_VERSION }}
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/ci.yaml
    secrets:
      CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
    permissions:
      id-token: write
      contents: read
      actions: read

  image:
    needs: [plan, ci]
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && (needs.plan.outputs.version != '')
    runs-on: arc-charmap
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/image
        with:
          platforms: linux/amd64,linux/arm64
          version: v${{ needs.plan.outputs.version }}
          image: ${{ env.IMAGE }}
          tag: ${{ needs.plan.outputs.version }}
          attestations: "true"
          labels: |
            org.opencontainers.image.title=charmap
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-only

  release:
    needs: [plan, image]
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-charmap
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write # tag and GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semrel
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: ${{ env.SEMANTIC_RELEASE_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the release matches the verified image
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          RELEASED: ${{ steps.semrel.outputs.new_release_version }}
        run: |
          if [ "$PLANNED" != "$RELEASED" ]; then
            echo "::error::planned v$PLANNED but released '$RELEASED'; the image tags were not moved"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point latest, major and minor tags at the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MAJOR: ${{ needs.plan.outputs.major }}
          MINOR: ${{ needs.plan.outputs.minor }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$MAJOR" \
            --tag "$IMAGE:$MAJOR.$MINOR" \
            "$IMAGE:$VERSION"
