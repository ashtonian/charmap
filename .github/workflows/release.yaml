name: Release

# Every push to main is tested, then released if its commits call for one
# (see .releaserc.yaml). The image is built, pushed under its version and
# verified before the Git tag exists, so a tag never points at a missing or
# broken image and a failed run can simply be re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release at a time. A queued run waits rather than cancelling one that
# may already have pushed an image.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: docker.io/ashtonian/charmap
  SEMANTIC_RELEASE_VERSION: 25.0.9

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  plan:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # semantic-release verifies push access even in dry-run mode.
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.new_release_version }}
      major: ${{ steps.semrel.outputs.new_release_major_version }}
      minor: ${{ steps.semrel.outputs.new_release_minor_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semrel
        uses: cycjimmy/semantic-release-action@8be816a60e417d22b0e09b61adc23605036497eb # v7.1.0
        with:
          semantic_version: ${{ env.SEMANTIC_RELEASE_VERSION }}
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ needs.plan.outputs.version }}
          build-args: VERSION=v${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=charmap
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Verify every platform
        env:
          REF: ${{ env.IMAGE }}:${{ needs.plan.outputs.version }}@${{ steps.build.outputs.digest }}
        run: scripts/verify-image.sh "$REF"

  release:
    needs: [plan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tag and GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semrel
        uses: cycjimmy/semantic-release-action@8be816a60e417d22b0e09b61adc23605036497eb # v7.1.0
        with:
          semantic_version: ${{ env.SEMANTIC_RELEASE_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the release matches the verified image
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          RELEASED: ${{ steps.semrel.outputs.new_release_version }}
        run: |
          if [ "$PLANNED" != "$RELEASED" ]; then
            echo "::error::planned v$PLANNED but released '$RELEASED'; the image tags were not moved"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point latest, major and minor tags at the release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MAJOR: ${{ needs.plan.outputs.major }}
          MINOR: ${{ needs.plan.outputs.minor }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$MAJOR" \
            --tag "$IMAGE:$MAJOR.$MINOR" \
            "$IMAGE:$VERSION"
